[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-cartoonify"
version = "2.0.0"
description = "A production-grade Python library, CLI, and REST API for high-performance image cartoonization using OpenCV."
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "opencv",
    "computer-vision",
    "cartoonify",
    "image-processing",
    "fastapi",
    "cli"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.22.0",
    "opencv-python>=4.8.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
]
all = [
    "easy-cartoonify[api,dev]"
]

[project.scripts]
easy-cartoonify = "easy_cartoonify.cli:main"

[tool.setuptools.packages.find]
include = ["easy_cartoonify*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
